# XDK 5028 library data layouts the runtime reads or writes, proven from THIS title's
# default.xbe (BMX XXX, USA, title 0x4143000E), read from out/bmx5028.exe (xbe2pe.py flat PE,
# guest addresses 1:1). Every line is UNPROVEN unless it cites the address and instruction in
# our image that proves it; a line kept from the 5558 reference (The Sims: Bustin' Out) without
# a proof in this build carries an explicit `# UNPROVEN: kept from 5558` marker.
#
# TALLY: 36 proven from our image / 9 UNPROVEN kept from 5558.
# 5028 is OLDER than both 5233 (CDevice 0x2040) and 5558 (CDevice 0x24A0) and its geometry is
# NOT theirs: CDevice here is 0x2030, Textures 0xB38 (not 0xF88), Transforms 0x810 (not 0xC60),
# Viewport 0xA90 (not 0xEE0), RenderTarget 0x15B4 (not 0x1A04), IndexBuffer 0x388 (not 0x7A0).
#
# Device base: the static D3D__pDevice at 0x1A8578 points at the CDevice at 0x1A6540.
#   Direct3D_CreateDevice 0x199A43 `mov dword_1A8578, offset dword_1A6540`; 0x199A8D clears it
#   on failure; every accessor below loads dword_1A8578 (0x1968C9, 0x196B2D, 0x1983B6, ...).
#   Corroboration for the size: 0x1A6540 + 0x2030 = 0x1A8570, and dword_1A8578 sits at 0x1A8578.
#   (config/game.toml [data] D3D_pDevice = 0x1A8578, D3D_Device = 0x1A6540.)
[layout]
# D3D8 CDevice (static at 0x1A6540, size 0x2030)
CDevice_Push          = 0x0     # D3DDevice_SetTexture 0x196910 `mov eax,[ebp+0]`; 0x196913 `cmp eax,[ebp+4]`; 0x196907/0x196A67/0x196DAD store the advanced pointer at [device+0]
CDevice_PushThreshold = 0x4     # D3DDevice_SetTexture 0x196913 `cmp eax,[ebp+4]` then calls MakeSpace sub_19C110 (0x196921); same test at 0x196969/0x196DCF
CDevice_BaseVertex    = 0x1C    # D3DDevice_SetIndices (body 0x196B20) 0x196B79 `mov [esi+1Ch], ebp` stores the BaseVertexIndex argument
CDevice_IndexBuffer   = 0x388   # D3DDevice_SetIndices (body 0x196B20) releases [esi+388h] at 0x196B50 and stores the new index buffer at 0x196B72
CDevice_ZScale        = 0x50C   # D3DDevice_SetRenderTarget sub_19B3F0 passes `lea eax,[edi+50Ch]` (0x19B6EE) to sub_19E960, which stores the depth-format Z scale float there (0x19E96E/0x19E975/0x19E97C/0x19E983); the viewport push helper multiplies viewport MinZ [esi+0AA0h] by [esi+50Ch] at 0x19B219-0x19B225
CDevice_SuperSampleX  = 0x95C   # UNPROVEN: kept from 5558
CDevice_SuperSampleY  = 0x960   # UNPROVEN: kept from 5558
CDevice_Transforms    = 0x810   # D3DDevice_SetTransform 0x196648-0x19665C: `mov ecx,eax; shl ecx,6; lea edi,[ecx+ebx+810h]`, copies 16 dwords -> type * 64 stride at base 0x810
CDevice_Textures      = 0xB38   # D3DDevice_SetTexture 0x1968D0 reads [ebp+ebx*4+0B38h], 0x196907 stores the new texture there (stage * 4)
CDevice_Palettes      = 0xB48   # D3DDevice_SetPalette (body 0x196A80) reads [esi+ebx*4+0B48h] at 0x196A91 and stores at 0x196AC4, emitting command 0x41B20 (0x196AFD)
CDevice_RenderTarget  = 0x15B4  # D3DDevice_SetRenderTarget sub_19B3F0 stores the target at 0x19B696 `mov [edi+15B4h], ebx` and releases the old one read at 0x19B66A; Release 0x19DF42/0x19DF6A
CDevice_Depth         = 0x15B8  # D3DDevice_SetRenderTarget sub_19B3F0 stores the depth surface at 0x19B6BE `mov [edi+15B8h], esi` and releases the old one read at 0x19B68E; Release 0x19DF70/0x19DF94
CDevice_BackBuffer    = 0x15C0  # GetBackBuffer2 0x196250 computes eax=0 for index 0 and returns [device+0x15C0] at 0x19626D; SetRenderTarget 0x19B410 compares the target against the back buffer [edi+15C0h]; Release 0x19DFA2 walks this array base
CDevice_FrontBuffer   = 0x15C4  # GetBackBuffer2 0x196250 computes eax=1 for index -1 and returns [device + 1*4 + 0x15C0] = 0x15C4 at 0x19626D
CDevice_SwapCount     = 0x2010  # D3DDevice_Swap 0x1983B0 `inc dword ptr [esi+2010h]` at 0x198410 and 0x198450, returns [esi+2010h] at 0x19847F
CDevice_Size          = 0x2030  # Direct3D_CreateDevice 0x199A00 failure path clears the device: 0x199A7E `mov ecx, 80Ch` / 0x199A83 `mov edi, offset dword_1A6540` / 0x199A88 `rep stosd` = 0x80C dwords = 0x2030 bytes
CDevice_Flags         = 0x8     # Direct3D_CreateDevice 0x199A35-0x199A57 ORs (BehaviorFlags & 0x10) into dword_1A6548 = device+8; SetTransform 0x1966E2 `mov eax,[ebx+8]` / 0x1966EE stores it
CDevice_Time          = 0x2C    # D3DDevice_SetTexture 0x1968E3 reads [ebp+2Ch] and stamps it into resource+8 (0x1968EE); SetStreamSource 0x1989DA and SetRenderTarget 0x19B67D do the same
CDevice_PixelShader   = 0x36C   # D3DDevice_SetPixelShader 0x19BB0A reads and 0x19BB14 stores the shader handle at [ebx+36Ch]
CDevice_VertexShader  = 0x37C   # device init 0x19DC13 `mov dword ptr [eax+37Ch], offset dword_1A5E28` installs the static default vertex shader; the constant-upload helper 0x199180 dereferences [esi+37Ch]
CDevice_BackBufferScale = 0x518 # SetRenderTarget sub_19B3F0 writes the surface-derived scale X at 0x19B92B `mov [edi+518h], edx` (Y at 0x19B923 `mov [edi+51Ch], eax`); the viewport push helper multiplies viewport X/Y by [esi+518h]/[esi+51Ch] at 0x19B17A/0x19B19C
CDevice_Viewport      = 0xA90   # D3DDevice_SetViewport 0x196750 stores X/Y/W/H at [esi+0A90h..0A9Ch] (0x19684B-0x19685D) and MinZ/MaxZ at [esi+0AA0h]/[esi+0AA4h] (0x196866/0x19686F); the push helper loads X from [esi+0A90h] at 0x19B164/0x19B16A
CDevice_ScreenSpaceOffset = 0xAA8 # the viewport push helper adds [esi+0AA8h] (X, 0x19B188) and [esi+0AACh] (Y, 0x19B1A9) to the scaled viewport origin; device init 0x19D0B6/0x19D0BC seeds both from dword_1A4C70
CDevice_AutoDepth         = 0x1A20 # UNPROVEN: kept from 5558
CDevice_VBlankCallback    = 0x1DB8 # UNPROVEN: kept from 5558 (5028 has a vblank pending flag at device+0x1978 — tested in Swap 0x19839F, cleared at the end of the vertical-blank handler 0x198358 — but no store of a caller callback was found; 0x1978 is a flag, not this field)
CDevice_VBlankEvent       = 0x1954 # the vertical-blank handler sub_1981E0 clears [device+1958h] at 0x19823F and then waits on the event at device+1954h (`add eax,1954h` 0x19824B, call dword_1D743C 0x198251); same clear-then-wait pair 5558 documents as device+0x1DBC/+0x1DC0
CDevice_DisplayFlags      = 0x1974 # the display-field query 0x196C60 tests [eax+1974h] & 0x1200000 at 0x196C72; the display-format query 0x196138 reads [eax+1974h]; device init passes device+197Ch to the HAL at 0x19DC8C
CDevice_VBlankCount       = 0x1980 # the display-field query 0x196C60 returns [eax+1980h] as the count into out+4 (0x196C65/0x196C6F); the vblank handler increments it at 0x1982BE/0x1982BF
CDevice_Field             = 0x1990 # the display-field query 0x196C60 reads [eax+1990h] at 0x196C7F and derives the field from it being zero (setz dl / inc edx at 0x196C89-0x196C8D)
CDevice_GammaRamps         = 0x1E04 # UNPROVEN: kept from 5558 (it is miniport-relative there: [device+0x1C28] + 0x1DC; 5028's driver-object pointer candidate is device+0x17C0, see 0x196EF8/0x19DF31, but the gamma path was not located in this image)
CDevice_GammaPending       = 0x2404 # UNPROVEN: kept from 5558 (miniport-relative there: [device+0x1C28] + 0x7DC; NOTE this is beyond the proven CDevice_Size 0x2030 and must not be written as a device offset until the 5028 miniport geometry is proven)
# D3D8 globals
DirtyFlags_Texture    = 0x4800  # D3DDevice_SetTexture 0x19694E `or eax, 4800h` into D3D_DirtyFlags dword_1A8580 (0x196954); SetPixelShader 0x19BB22 and SetTextureState 0x19AE6D do the same
TextureState_Stage    = 32      # D3DDevice_SetTextureState (body 0x19AE30) `shl ecx,5; add ecx,eax; mov dword_1A6338[ecx*4], edx` (0x19AE46-0x19AE52); the deferred setter sub_19AD20 does `shl esi,5` at 0x19AD79
Stream_Size           = 12      # D3DDevice_SetStreamSource 0x1989CA `lea esi,[eax+eax*2]; shl esi,2` indexes the stream tables by stream * 12
Stream_Stride         = 0x0     # D3DDevice_SetStreamSource 0x198A00/0x198A0C uses dword_1A5F40[stream*12 + 0] for Stride (D3D_Streams = 0x1A5F40)
Stream_Buffer         = 0x8     # D3DDevice_SetStreamSource 0x1989D0/0x198A18 uses dword_1A5F48[stream*12 + 8] for the buffer (0x1A5F40 + 8)
PixelShader_Definition = 0x8    # D3DDevice_SetPixelShader 0x19BB81 `mov edx,[eax+8]` reads the definition pointer from the shader object, then [edx+20h]/[edx+24h]/[edx+0D8h]
# DSOUND
CDirectSoundStream_Vtable  = 0x0  # the two-vtable DSOUND constructor sub_150982 stores the first vtable at [esi+0] (0x1509AB `mov dword ptr [esi], offset off_1D7D20`) and the second at [esi+4] (0x1509B1, off_1D7D14); both tables point into DSOUND code (0x15068A/0x150697 and 0x1509C6/0x15093E)
CDirectSoundStream_Vtable2 = 0x4  # same constructor 0x1509B1 `mov dword ptr [esi+4], offset off_1D7D14` (second vtable), overwriting the [esi+4] slot set at 0x150988
EffectsImage_Skip0    = 0x804   # the effects-image walker sub_14C3EE reads the dword count at [image+804h] (0x14C407 `add eax,[ebx+804h]`, 0x14C50D `sub ecx,[ebx+804h]`)
EffectsImage_Skip1    = 0x80C   # the same walker reads the dword count at [image+80Ch] (0x14C401 `mov eax,[ebx+80Ch]`, 0x14C60C)
EffectsImage_Desc     = 0x818   # the same walker forms the descriptor pointer at image + 0x818 + (Skip0 + Skip1) * 4 (0x14C410 lea esi,[ebx+eax*4+818h]; base loads at 0x14C468 and 0x14C62A)
# XAPI XPP device type record
XPP_Current           = 0x0     # UNPROVEN: kept from 5558
XPP_Changed           = 0x4     # UNPROVEN: kept from 5558
XPP_Previous          = 0x8     # UNPROVEN: kept from 5558
